<title>Pitch IQ Prototip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one-thumb phone app. Content scrolls; every action sits in the lower half of the screen. */
:root {
  --bg: #F3F6F0; --surface: #FFFFFF; --surface-2: #E7EEE5; --ink: #0B1F14; --muted: #46594C; --line: #D3DCD1;
  --pitch: #0F5132; --pitch-deep: #041A10; --gold: #FFD200; --gold-ink: #041A10; --accent-text: #0F5132;
  --hit: #1F8A4C; --near: #B98900; --miss: #C2412F; --on-result: #FFFFFF;
  --display: "Anton", Impact, "Arial Narrow", sans-serif;
  --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --label: "Barlow Condensed", "Archivo", "Arial Narrow", sans-serif;
  --fs: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #041A10; --surface: #0A2A1B; --surface-2: #10301F; --ink: #EEF3EE; --muted: #A6BCAE; --line: #1D4331;
    --accent-text: #FFD200; --hit: #2FA35F; --near: #E0B100; --miss: #D6493A; --on-result: #041A10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #041A10; --surface: #0A2A1B; --surface-2: #10301F; --ink: #EEF3EE; --muted: #A6BCAE; --line: #1D4331;
  --accent-text: #FFD200; --hit: #2FA35F; --near: #E0B100; --miss: #D6493A; --on-result: #041A10;
  color-scheme: dark;
}
:root[data-cb="1"] { --hit: #2F7FD8; --near: #E0B100; --miss: #E8862A; }

* { box-sizing: border-box; }
html { font-size: var(--fs); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.5 var(--body); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
.app { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 0 32px; min-height: 100%; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 10px; padding-block: 10px; background: var(--bg); }
.bar .logo { display: flex; align-items: center; gap: 8px; font: 400 1.35rem/1 var(--display); letter-spacing: .04em; }
.bar .logo b { color: var(--accent-text); font-weight: 400; }
.bar .logo svg { width: 32px; height: 32px; border-radius: 9px; }
.bar .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border-radius: 99px; background: var(--surface-2); font: 700 .85rem/1 var(--label); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.chip.zero { background: var(--gold); color: var(--gold-ink); }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; }

.label { font: 700 .82rem/1 var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--accent-text); }
h2.section { font: 400 1.5rem/1 var(--display); text-transform: uppercase; letter-spacing: .02em; margin: 28px 0 12px; }
.muted { color: var(--muted); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border-radius: 14px; border: 2px solid transparent; font-weight: 800; cursor: pointer; text-decoration: none; }
.btn.gold { background: var(--gold); color: var(--gold-ink); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* daily hero */
.hero { margin-top: 6px; border-radius: 22px; padding: 20px; color: #fff; background: radial-gradient(110% 90% at 90% 0%, rgb(255 210 0 / .16), transparent 55%), linear-gradient(160deg, #13663F, var(--pitch) 45%, var(--pitch-deep)); display: grid; gap: 14px; }
.hero .label { color: var(--gold); }
.hero h1 { margin: 0; font: 400 2.2rem/1 var(--display); text-transform: uppercase; }
.hero-row { display: flex; flex-wrap: wrap; gap: 8px; }
.hero .chip { background: rgb(255 255 255 / .12); color: #fff; }
.hero .chip.streak { background: var(--gold); color: var(--gold-ink); }
.count { font: 400 1.6rem/1 var(--display); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.hero .solved { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; }
.hero .score { font: 400 2.6rem/1 var(--display); }

/* modes */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px; display: grid; gap: 6px; cursor: pointer; min-height: 120px; align-content: start; }
.mode .ico { font-size: 1.5rem; }
.mode b { font-weight: 800; }
.mode .meta { display: flex; gap: 8px; align-items: center; font: 700 .8rem/1 var(--label); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.dots { display: inline-flex; gap: 3px; } .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); } .dots i.on { background: var(--accent-text); }
.mode.locked { opacity: .6; }

/* rank journey */
.rank { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.rank-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.rank-top b { font: 400 1.6rem/1 var(--display); text-transform: uppercase; }
.ladder { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.ladder span { height: 10px; border-radius: 3px; background: var(--surface-2); }
.ladder span.done { background: var(--pitch); } .ladder span.cur { background: var(--gold); }
.ladder-names { display: flex; justify-content: space-between; font: 700 .75rem/1.2 var(--label); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ladder-names .locked { filter: blur(3px); }

/* game */
.path { display: grid; gap: 6px; margin: 8px 0 14px; counter-reset: c; }
.path li { list-style: none; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-weight: 600; }
.path li::before { counter-increment: c; content: counter(c); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font: 700 .85rem/1 var(--label); flex: none; }
.path { padding: 0; }
.guesses { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.g { min-height: 46px; border-radius: 10px; border: 2px dashed var(--line); display: grid; place-items: center; font: 700 .85rem/1.1 var(--label); letter-spacing: .04em; text-align: center; padding: 4px; }
.g.hit, .g.near, .g.miss { border-style: solid; color: var(--on-result); }
.g.hit { background: var(--hit); border-color: var(--hit); }
.g.near { background: var(--near); border-color: var(--near); }
.g.miss { background: var(--miss); border-color: var(--miss); }
.g .sym { display: block; font-size: 1.1rem; }
.feedback { min-height: 1.5em; font-weight: 600; margin-bottom: 8px; }

.dock { position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 80%, transparent); display: grid; gap: 10px; }
.hints { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.hint { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; gap: 2px; place-items: center; padding: 6px; }
.hint b { font-size: .9rem; } .hint small { font: 700 .75rem/1 var(--label); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.hint.used { background: var(--surface-2); cursor: default; } .hint.used b { color: var(--accent-text); }
.search { position: relative; }
.search input { width: 100%; min-height: 54px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); padding: 0 16px; font-size: 1.05rem; }
.search input:focus { border-color: var(--pitch); outline: none; }
.sugs { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px rgb(0 0 0 / .18); }
.sugs button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 12px 14px; min-height: 48px; cursor: pointer; border-bottom: 1px solid var(--line); }
.sugs button:last-child { border-bottom: 0; }
.sugs button[aria-selected="true"], .sugs button:hover { background: var(--surface-2); }
.sugs small { color: var(--muted); display: block; }
.sugs .hintline { padding: 10px 14px; color: var(--muted); font-size: .9rem; }

/* result + learn card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 12px; margin-top: 12px; }
.big { font: 400 2.4rem/1 var(--display); text-transform: uppercase; }
.share-preview { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
.share-preview canvas { width: 96px; height: auto; border-radius: 10px; box-shadow: 0 6px 16px rgb(0 0 0 / .25); }
pre.sharetext { margin: 0; white-space: pre-wrap; font: 600 .95rem/1.35 var(--body); background: var(--surface-2); padding: 10px 12px; border-radius: 10px; }
.learn .clubs { display: flex; flex-wrap: wrap; gap: 6px; }
.learn .clubs span { background: var(--surface-2); padding: 6px 10px; border-radius: 99px; font-size: .9rem; font-weight: 600; }

/* sheet + toast */
.sheet { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; align-items: end; z-index: 20; }
.sheet > div { background: var(--surface); border-radius: 22px 22px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); max-width: 480px; width: 100%; margin: 0 auto; display: grid; gap: 14px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.switch { width: 52px; height: 32px; border-radius: 99px; border: 0; background: var(--line); position: relative; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch[aria-checked="true"] { background: var(--pitch); } .switch[aria-checked="true"]::after { left: 24px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { min-width: 48px; min-height: 44px; border: 0; background: none; cursor: pointer; font-weight: 800; }
.seg button[aria-pressed="true"] { background: var(--pitch); color: #fff; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; background: var(--pitch-deep); color: #fff; padding: 12px 16px; border-radius: 12px; z-index: 30; max-width: calc(100% - 32px); font-weight: 600; }
.field { display: grid; gap: 6px; } .field input { min-height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); padding: 0 14px; }
.demo-note { margin-top: 28px; font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app" id="app"></div>
