  box-shadow:0 14px 30px -20px rgba(0,0,0,.95);
}
.atolye:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#F0B452}
.atolye.bitti{border-color:rgba(61,214,140,.30)}
.atolye.bitti:before{background:#3DD68C}
.atolye-bas{display:flex;align-items:center;gap:9px;padding:0 0 8px 5px}
.atolye-et{font-size:11.5px;font-weight:700;letter-spacing:.09em;color:#F0B452}
.atolye-rozet{margin-left:auto;font-size:12px;font-weight:650;padding:3px 10px;
  border-radius:100px;background:rgba(255,107,94,.18);color:#FF8478;white-space:nowrap}
.atolye-rozet.ok{background:rgba(61,214,140,.16);color:#3DD68C}
.atolye-ozet{display:flex;gap:16px;padding:0 5px 9px;font-size:12.5px;color:#9BA7AC;
  font-variant-numeric:tabular-nums}
.atolye-ozet b{color:#ECF2F1;font-weight:650}
.isemri{display:flex;align-items:center;gap:11px;padding:11px 5px;
  border-top:1px solid rgba(255,255,255,.09)}
.ise-ad{flex:1;min-width:0;font-size:15.5px;font-weight:600;line-height:1.25;color:#ECF2F1}
.ise-ad small{display:block;font-size:12px;font-weight:400;color:#9BA7AC;
  margin-top:3px;line-height:1.3}
.isemri.karli .ise-ad small{color:#5FD79C}
.atolye .btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.17);
  color:#ECF2F1;box-shadow:none}
.atolye .btn.primary{background:#F0B452;border-color:transparent;color:#1A1203;font-weight:700}
.atolye .btn:disabled{opacity:.34}
.ise-btn{flex:none;min-width:106px;min-height:48px;flex-direction:column;gap:1px;
  padding:7px 14px;border-radius:12px;font-size:15px;line-height:1.05}
.ise-btn em{font-style:normal;font-size:12px;font-weight:600;opacity:.80;
  font-variant-numeric:tabular-nums}
.atolye-not{padding:9px 5px 1px;font-size:12px;line-height:1.4;color:#7A868B;
  border-top:1px solid rgba(255,255,255,.09)}
.atolye.bitti .atolye-not{border-top:none;padding-top:0;color:#9BA7AC;font-size:13px}

/* ---------- KADEMELİ EKSPERTİZ ----------
   Atölyenin kardeşi: aynı koyu tezgâh dili, ama kehribar yerine çelik
   kenar. Kehribar para harcanan tamir, çelik bilgi satın alınan bakış. */
.bakis{
  background:linear-gradient(180deg,#1A2126,#12181B);
  border:1px solid rgba(159,182,196,.30);
  border-radius:16px;padding:12px 13px 11px;margin:0 0 14px;
  color:#ECF2F1;position:relative;overflow:hidden;
  box-shadow:0 14px 30px -20px rgba(0,0,0,.95);
}
.bakis:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#9FB6C4}
.bakis-bas{display:flex;align-items:center;gap:9px;padding:0 0 8px 5px}
.bakis-et{font-size:11.5px;font-weight:700;letter-spacing:.09em;color:#9FB6C4}
.bakis-rozet{margin-left:auto;font-size:12px;font-weight:600;padding:3px 10px;border-radius:100px;
  background:rgba(159,182,196,.16);color:#C3D2DB;white-space:nowrap}
.bakis-not{padding:0 5px 8px;font-size:12.5px;color:#9BA7AC;line-height:1.4}
.bakis-not.alt{padding:8px 5px 0;border-top:1px solid rgba(255,255,255,.09);font-size:12px;color:#7A868B}
.bakis-organ{display:flex;flex-wrap:wrap;gap:7px;padding:0 3px}
.bakis .btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.17);color:#ECF2F1}
.bakis .btn.primary{background:#EDE7DA;border-color:transparent;color:#15181A;font-weight:700}
.bakis .btn:disabled{opacity:.34}
.bakbtn{flex:1 1 30%;min-width:88px;min-height:42px;padding:9px 10px;border-radius:11px;font-size:14px}

/* ---------- GALERİCİNİN DEFTERİ ----------
   Oyuncunun kendi kazandığı bilgi. Oyunun verdiği ipuçlarından ayrılsın
   diye el yazısı tonunda bir şerit: kenarında kalem çizgisi var. */
.defternot{margin:0 0 12px;padding:9px 12px 9px 13px;border-radius:0 11px 11px 0;
  border-left:3px solid var(--gold);background:var(--gold-soft);
  font-size:13px;line-height:1.45;color:var(--label-2)}
.defternot b{color:var(--gold);font-weight:700;margin-right:3px}
.defternot em{font-style:normal;font-weight:650;color:var(--label)}
.bakis .defternot{margin:0 3px 10px;background:rgba(240,180,82,.13);color:#C8CFD3}
.bakis .defternot b{color:#F0B452}
.bakis .defternot em{color:#ECF2F1}
.belge .defternot{background:rgba(138,91,6,.10);border-left-color:#8A5B06;color:var(--murekkep-2)}
.belge .defternot b{color:#8A5B06}
.belge .defternot em{color:var(--murekkep)}

/* ---------- GALERİNİN YERİ ----------
   Atölye/bakış/ilan ailesinin dördüncü üyesi. Rengi plaka mavisi: burada
   ne tamir ne bilgi, GAYRİMENKUL kararı veriliyor. */
.yer{
  background:linear-gradient(180deg,#171E27,#111820);
  border:1px solid rgba(132,164,205,.28);
  border-radius:16px;padding:12px 13px 11px;margin:0 0 12px;
  color:#ECF2F1;position:relative;overflow:hidden;
  box-shadow:0 14px 30px -20px rgba(0,0,0,.95);
}
.yer:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#84A4CD}
.yer-bas{display:flex;align-items:center;gap:9px;padding:0 0 9px 5px}
.yer-et{font-size:11.5px;font-weight:700;letter-spacing:.09em;color:#84A4CD}
.yer-rozet{margin-left:auto;font-size:12px;font-weight:650;padding:3px 10px;border-radius:100px;
  background:rgba(255,255,255,.08);color:#9BA7AC;white-space:nowrap}
.yer-rozet.dolu{background:rgba(255,107,94,.18);color:#FF8478}
/* park yerleri: dolu olanlar aydınlık, boşlar kesik çizgili */
.yer-kutu{display:flex;gap:6px;padding:0 4px 11px}
.yer-kutu i{flex:1;height:26px;border-radius:6px;display:block;
  border:1.5px dashed rgba(255,255,255,.16);background:rgba(255,255,255,.03)}
.yer-kutu i.var{border:1.5px solid rgba(132,164,205,.55);background:rgba(132,164,205,.22)}
.yer-satir{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:7px 5px;border-top:1px solid rgba(255,255,255,.08);font-size:14px;color:#9BA7AC;
  font-variant-numeric:tabular-nums}
.yer-satir b{color:#ECF2F1;font-weight:650}
.yer-not{padding:8px 5px 2px;font-size:12px;line-height:1.45;color:#7A868B}
.yer-not.alt{border-top:1px solid rgba(255,255,255,.08);margin-top:8px;color:#C58C84}
.yer .btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.17);color:#ECF2F1}
.yer .btn.primary{background:#84A4CD;border-color:transparent;color:#0E1419;font-weight:700}
.yer .btn:disabled{opacity:.34}
/* süreli komşu dükkân teklifi */
.yer-teklif{margin:10px 2px 0;padding:11px 12px;border-radius:13px;
  background:rgba(240,180,82,.10);border:1px solid rgba(240,180,82,.40)}
.yt-bas{font-size:11px;font-weight:700;letter-spacing:.09em;color:#F0B452;
  display:flex;align-items:center;gap:8px}
.yt-bas em{margin-left:auto;font-style:normal;font-size:11.5px;letter-spacing:0;
  background:rgba(240,180,82,.20);border-radius:100px;padding:2px 9px}
.yt-met{font-size:12.5px;line-height:1.45;color:#C8CFD3;margin:6px 0 9px}
/* gün raporunda kaçan fırsat satırı */
.ev.firsat{border-left-color:var(--gold)}

/* ---------- SEZON IŞIĞI ----------
   Dört sezon vardı ama dört ekran aynı sıcaklıktaydı. Jetonlar aynı
   kalıyor; yalnızca zeminin ışığı ve çok hafif bir ton kayıyor. Oyun
   mevsimle birlikte ısınıp soğuyor, hiçbir okunabilirlik bozulmadan. */
:root[data-sezon="kis"]      body{--sezonIsik:rgba(120,170,205,.075); --sezonTon:rgba(26,42,56,.40)}
:root[data-sezon="ilkbahar"] body{--sezonIsik:rgba(120,205,150,.075); --sezonTon:rgba(24,48,38,.34)}
:root[data-sezon="yaz"]      body{--sezonIsik:rgba(230,185,110,.085); --sezonTon:rgba(54,42,24,.34)}
:root[data-sezon="sonbahar"] body{--sezonIsik:rgba(214,140,80,.075);  --sezonTon:rgba(52,34,22,.36)}
body{
  background:
    radial-gradient(120% 70% at 50% -12%, var(--sezonIsik, rgba(22,184,174,.07)), transparent 62%),
    linear-gradient(180deg, var(--sezonTon, transparent) 0%, transparent 46%),
    var(--bg);
  background-attachment:fixed;
  transition:background-color .6s ease;
}

/* ---------- MİKRO HAREKET ---------- */
@keyframes gunDon{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.gun-don{animation:gunDon .34s cubic-bezier(.2,.8,.2,1)}
/* tamir edilen organın çubuğu dolarken */
.bar i.dolan{transition:width .62s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){
  .gun-don{animation:none}
  .bar i.dolan{transition:none}
}

/* ---------- PAZARLIK SAHNESİ ----------
   Üst üçte bir mekân: arkada aracın silüeti, önünde satıcının yüzü ve
   istenen fiyat. Zemin bir galeri önü — ufuk çizgisi ve yer gölgesi. */
.sahne{
  position:relative;margin:0 0 12px;padding:10px 12px 11px;border-radius:16px;overflow:hidden;
  background:
    radial-gradient(130% 90% at 50% 8%, rgba(159,182,196,.10), transparent 62%),
    linear-gradient(180deg,#1A2328 0%,#121A1E 58%,#0D1316 100%);
  border:1px solid var(--sep-soft);
  box-shadow:0 16px 34px -24px rgba(0,0,0,.95);
}
/* yer çizgisi: araç havada durmasın */
.sahne:after{content:"";position:absolute;left:0;right:0;bottom:16px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.10) 22%,rgba(255,255,255,.10) 78%,transparent)}
.sahne-arac{position:absolute;right:-7%;bottom:4px;width:66%;opacity:.38;pointer-events:none}
.sahne-arac svg.aracsvg{width:100%;height:auto;display:block;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.6))}
.sahne-on{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px;min-height:124px}
/* Fiyat ÜSTTE ve tek başına: satıcının tanıtım metniyle çakışmıyor,
   ekranın en büyük tipografisi olarak kalıyor. */
.sahne-fiyat{order:-1;align-self:flex-end;text-align:right;max-width:66%}
.sahne-yuz{max-width:82%}
.sahne-yuz .sec-note{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden}
.sahne-fiyat span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.14em;
  color:var(--label-3)}
.sahne-fiyat b{display:block;font-size:27px;font-weight:800;letter-spacing:-.03em;
  color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.05;margin-top:2px;
  text-shadow:0 2px 14px rgba(0,0,0,.65)}
.sahne-fiyat i{display:block;font-style:normal;font-size:11.5px;color:var(--label-3);margin-top:3px}
.sahne-fiyat i.pos{color:var(--green)} .sahne-fiyat i.neg{color:var(--red)}
@media (max-width:360px){ .sahne-fiyat b{font-size:23px} .sahne-arac{width:70%} }

/* ---------- EKSPERTİZ MÜHRÜ ----------
   Kâğıda eğik basılmış kauçuk mühür: çift çerçeve, hafif saydam, harfler
   aralıklı. Raporun hükmünü tek bakışta veriyor. */
/* Mühür başlık hizasında durur ve içeriği örtmez: damgalı blok üstten
   yer açıyor. Önceki hâlinde ilk çubuk satırının üstüne biniyordu. */
.muhurlu{position:relative;padding-top:44px}
.belge .block.muhurlu{padding-top:44px}
.muhur{position:absolute;right:8px;top:3px;z-index:1;pointer-events:none;
  transform:rotate(-9deg);transform-origin:right top;
  display:inline-block;text-align:center;padding:4px 10px 3px;
  border:2.5px solid currentColor;border-radius:5px;
  box-shadow:0 0 0 1.5px currentColor inset;opacity:.80}
.muhurlu>h4{position:absolute;top:14px;left:2px;margin:0}
.muhur b{display:block;font-size:12.5px;font-weight:800;letter-spacing:.10em;line-height:1}
.muhur i{display:block;font-style:normal;font-size:7.5px;letter-spacing:.14em;
  margin-top:3px;opacity:.78;font-variant-numeric:tabular-nums}
.muhur.temiz{color:#2E8B5E}
.muhur.tramer{color:#9A6B10}
.muhur.agir{color:#A8352C}
/* koyu yüzeyde mühür daha parlak olmalı, yoksa kaybolur */
.block.muhurlu .muhur.temiz{color:#3DD68C}
.block.muhurlu .muhur.tramer{color:#F0B452}
.block.muhurlu .muhur.agir{color:#FF6B5E}
@media (max-width:360px){ .muhur{transform:rotate(-9deg) scale(.88)} }

/* ---------- PAZAR KARTI (yeni düzen) ----------
   Araç şeridi kartın kahramanı. Zemin hafif bir vitrin ışığı taşıyor,
   altında aracın gölgesi var; plaka sağ alt köşede duruyor. */
.card.kart2{padding:0;overflow:hidden}
.kart-sahne{position:relative;padding:7px 12px 2px;
  background:
    radial-gradient(120% 120% at 50% 118%, rgba(255,255,255,.055), transparent 62%),
    linear-gradient(180deg, rgba(255,255,255,.028), rgba(0,0,0,.14));
  border-bottom:.5px solid var(--sep-soft)}
.kart-sahne svg.aracsvg{width:100%;height:auto;display:block;max-height:66px;
  filter:drop-shadow(0 5px 10px rgba(0,0,0,.45))}
.kart-plaka{position:absolute;right:10px;bottom:5px;transform:scale(.82);transform-origin:right bottom}
.kart-govde{display:flex;align-items:flex-end;gap:10px;padding:8px 13px 3px}
.kart-sol{flex:1;min-width:0}
.kart-ad{font-size:16.5px;font-weight:650;letter-spacing:-.018em;line-height:1.2;color:var(--label);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kart-ad i{font-style:normal;color:var(--label-3);font-weight:500}
.kart-alt{font-size:12.5px;color:var(--label-2);margin-top:2px;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Dar ekranda vites düşer: "1.6 Dizel · 143.000 km · Ot…" diye kesilmektense
   üçüncü bilgi hiç görünmesin. Vites zaten araç sayfasında yazıyor. */
@media (max-width:420px){ .kart-vites{display:none} }
.kart-fiyat{flex:none;text-align:right;font-size:18px;font-weight:700;letter-spacing:-.026em;
  color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.05}
.kart-fiyat small{display:block;font-size:11px;font-weight:400;color:var(--label-3);
  letter-spacing:0;margin-top:2px}
.kart-cip{display:flex;gap:5px;flex-wrap:wrap;padding:6px 13px 10px}
.card.kart2 .deal,.card.kart2 .pl{margin-top:0}
/* dar ekranda şerit biraz alçalsın, kart listeyi boğmasın */
@media (max-width:360px){ .kart-sahne svg.aracsvg{max-height:58px} }

/* ---------- İLANI KUR ----------
   Atölye ve bakış ile aynı aile: koyu tezgâh paneli. Burada rengi yeşil,
   çünkü bu panelde para harcanmıyor, para kazanılacak karar veriliyor. */
.ilan{
  background:linear-gradient(180deg,#16211C,#111A17);
  border:1px solid rgba(61,214,140,.26);
  border-radius:16px;padding:12px 13px 11px;margin:0 0 12px;
  color:#ECF2F1;position:relative;overflow:hidden;
  box-shadow:0 14px 30px -20px rgba(0,0,0,.95);
}
.ilan:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#3DD68C}
.ilan-bas{display:flex;align-items:center;gap:9px;padding:0 0 6px 5px}
.ilan-et{font-size:11.5px;font-weight:700;letter-spacing:.09em;color:#3DD68C}
.ilan-rozet{margin-left:auto;font-size:12px;font-weight:600;padding:3px 10px;border-radius:100px;
  background:rgba(255,255,255,.08);color:#9BA7AC;white-space:nowrap}
.ilan-alt{font-size:10.5px;font-weight:700;letter-spacing:.09em;color:#6F7C82;padding:8px 5px 6px}
.ilan-secim{display:flex;gap:7px;padding:0 3px}
.ilansec{flex:1 1 0;min-width:0;min-height:58px;padding:8px 8px;border-radius:12px;text-align:left;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#C8CFD3}
.ilansec b{display:block;font-size:13.5px;font-weight:650;color:#ECF2F1;line-height:1.2}
